# netspeed.biplane.cc — the download page. The image itself lives on GitHub
# Releases: one copy of the bytes, so the page and the download cannot drift.
#
# Install:
#   sudo cp nginx-netspeed.conf /etc/nginx/sites-available/netspeed
#   sudo ln -s /etc/nginx/sites-available/netspeed /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate (the domain must already answer on port 80):
#   sudo certbot --nginx -d netspeed.biplane.cc
#
# And right after certbot — fix the address in the line it adds. It writes a
# bare `listen 443 ssl;`, and 0.0.0.0:443 cannot be taken on this machine:
# SERVER_IP:443 is already held by nginx itself. The bind fails, nginx quietly
# keeps serving the previous config, `nginx -t` still passes (it binds nothing),
# `systemctl reload` reports success, and the outside world gets another site's
# certificate. The only trace is `bind() to 0.0.0.0:443 failed` in
# /var/log/nginx/error.log. The cure:
#
#   sudo sed -i 's/^    listen 443 ssl;/    listen SERVER_IP:443 ssl;/' \
#       /etc/nginx/sites-available/netspeed
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT about listen: nginx on this host listens on one address rather than
# every interface (`listen SERVER_IP:80` in all the other sites, with an
# unrelated process sitting on another address). A bare `listen 80` would try to
# take 0.0.0.0:80, fail — the address is already in use — and the reload would
# go down taking every site on the machine with it. Hence the explicit address;
# on a move it changes here and nowhere else.

server {
    listen SERVER_IP:80;
    server_name netspeed.biplane.cc;

    root /var/www/netspeed;
    index index.html;

    # No site beyond the page and the image — do not list directories.
    autoindex off;

    access_log /var/log/nginx/netspeed.access.log;
    error_log  /var/log/nginx/netspeed.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # A short address on our own domain that always lands on the newest build,
    # so it can be written down somewhere and not go stale with each release.
    location = /download {
        return 302 https://github.com/sergeyerin/netspeed/releases/latest;
    }

    # Nothing here is versioned by file name, and the page changes with every
    # release — let browsers revalidate rather than sit on an old one.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
